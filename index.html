<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JLPT 單字卡" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>單字卡｜Vocab Memo</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#171717;--muted:#777;--line:#e7e7ea;--accent:#111;--good:#0a7f3f;--bad:#b42318;--soft:#eceef2}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Hiragino Sans",sans-serif}
    .app{max-width:620px;margin:0 auto;min-height:100vh;padding:18px 16px 110px}
    header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.brand{font-size:24px;font-weight:800}.pill{background:var(--card);border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);padding:14px;border-radius:16px;border:1px solid var(--line)}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.03)}
    .mode-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.mode-tabs button,.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--soft);font-size:14px;font-weight:700}.mode-tabs button.active,.btn.primary{background:var(--accent);color:#fff}
    .flash{min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}.word{font-size:46px;font-weight:850;letter-spacing:.5px}.reading{font-size:20px;color:var(--muted);margin-top:8px}.meaning{font-size:24px;font-weight:750}.example{margin-top:18px;color:var(--muted);line-height:1.55}.hint{font-size:13px;color:#aaa;margin-top:22px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn.good{background:#e8f6ee;color:var(--good)}.btn.bad{background:#fdecec;color:var(--bad)}
    .quiz-q{font-size:34px;font-weight:850;text-align:center;margin:14px 0 24px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:16px}.choice.correct{border-color:#7ac99b;background:#edf9f2}.choice.wrong{border-color:#e3a19b;background:#fff0ee}
    .section-title{font-size:18px;font-weight:800;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.small{font-size:12px;color:var(--muted)}
    .list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px}.item .main b{display:block}.item .main span{font-size:13px;color:var(--muted)}.iconbtn{border:0;background:#f2f2f4;border-radius:10px;padding:8px 10px}
    nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;z-index:10}nav .bar{max-width:620px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}nav button{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:700;color:#777}nav button.active{background:#111;color:#fff}
    .hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:30px 0}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">單字卡</div><div class="pill" id="todayLabel">今天</div></header>
  <div class="stats">
    <div class="stat"><b id="totalCount">0</b><span>全部單字</span></div>
    <div class="stat"><b id="masteredCount">0</b><span>已熟悉</span></div>
    <div class="stat"><b id="wrongCount">0</b><span>錯題</span></div>
  </div>

  <section id="learnPage">
    <div class="mode-tabs">
      <button class="active" data-deck="all">全部</button>
      <button data-deck="N4">N4</button>
      <button data-deck="N3">N3</button>
      <button data-deck="N2">N2</button>
      <button data-deck="N1">N1</button>
      <button data-deck="due">今日複習</button>
      <button data-deck="wrong">錯題</button>
    </div>
    <div class="panel">
      <div id="flashcard" class="flash">
        <div>
          <div class="word" id="fcWord">—</div>
          <div class="reading" id="fcReading"></div>
          <div class="meaning hidden" id="fcMeaning"></div>
          <div class="example hidden" id="fcExample"></div>
          <div class="hint" id="fcHint">點一下翻卡</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn bad" id="againBtn">還不會</button>
        <button class="btn good" id="knowBtn">記住了</button>
      </div>
    </div>
  </section>

  <section id="quizPage" class="hidden">
    <div class="panel">
      <div class="section-title">四選一測驗</div>
      <div class="small" id="quizProgress"></div>
      <div class="quiz-q" id="quizWord">—</div>
      <div class="choices" id="choices"></div>
      <button class="btn primary" id="nextQuiz" style="margin-top:14px;width:100%">下一題</button>
    </div>
  </section>

  <section id="addPage" class="hidden">
    <div class="panel">
      <div class="section-title">新增單字</div>
      <div class="row">
        <input id="wordInput" placeholder="單字／漢字，例如：約束" />
        <input id="readingInput" placeholder="假名，例如：やくそく" />
        <input id="meaningInput" class="full" placeholder="中文意思，例如：約定" />
        <textarea id="exampleInput" class="full" placeholder="例句（可不填）"></textarea>
      </div>
      <button class="btn primary" id="addWordBtn" style="width:100%;margin-top:12px">加入單字庫</button>
    </div>
    <div class="panel">
      <div class="section-title">批次匯入</div>
      <div class="small">每行格式：單字｜假名｜中文｜例句</div>
      <textarea id="bulkInput" placeholder="約束｜やくそく｜約定｜約束を守ります。\n経験｜けいけん｜經驗｜いい経験になりました。"></textarea>
      <button class="btn" id="bulkBtn" style="width:100%;margin-top:10px">批次加入</button>
    </div>
  </section>

  <section id="libraryPage" class="hidden">
    <div class="panel">
      <div class="section-title">我的單字庫</div>
      <input id="searchInput" placeholder="搜尋單字、假名或中文" />
      <div class="list" id="wordList" style="margin-top:12px"></div>
    </div>
  </section>
</div>

<nav><div class="bar">
  <button class="active" data-page="learnPage">背單字</button>
  <button data-page="quizPage">測驗</button>
  <button data-page="addPage">新增</button>
  <button data-page="libraryPage">單字庫</button>
</div></nav>

function getDeck(){ const now=Date.now(); if(deck==='wrong')return words.filter(x=>x.wrong>0); if(deck==='due')return words.filter(x=>!x.next||x.next<=now); if(['N4','N3','N2','N1'].includes(deck))return words.filter(x=>x.level===deck); return words; }

function rate(known){const arr=getDeck(); if(!arr.length)return; const x=arr[currentIndex]; const real=words.find(y=>y.w===x.w&&y.r===x.r&&(y.source||'')===(x.source||'')); if(known){real.score=(real.score||0)+1; real.wrong=Math.max(0,(real.wrong||0)-1); const days=Math.min(30,Math.pow(2,Math.max(0,real.score-1))); real.next=Date.now()+days*86400000;} else {real.score=Math.max(0,(real.score||0)-1); real.wrong=(real.wrong||0)+1; real.next=Date.now()+10*60000;} save(); currentIndex++; showCard();}
