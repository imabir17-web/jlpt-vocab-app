<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JLPT 單字卡" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>單字卡｜Vocab Memo</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#171717;--muted:#777;--line:#e7e7ea;--accent:#111;--good:#0a7f3f;--bad:#b42318;--soft:#eceef2}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Hiragino Sans",sans-serif}
    .app{max-width:620px;margin:0 auto;min-height:100vh;padding:18px 16px 110px}
    header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.brand{font-size:24px;font-weight:800}.pill{background:var(--card);border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);padding:14px;border-radius:16px;border:1px solid var(--line)}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.03)}
    .mode-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.mode-tabs button,.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--soft);font-size:14px;font-weight:700}.mode-tabs button.active,.btn.primary{background:var(--accent);color:#fff}
    .flash{min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}.word{font-size:46px;font-weight:850;letter-spacing:.5px}.reading{font-size:20px;color:var(--muted);margin-top:8px}.meaning{font-size:24px;font-weight:750}.example{margin-top:18px;color:var(--muted);line-height:1.55}.hint{font-size:13px;color:#aaa;margin-top:22px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn.good{background:#e8f6ee;color:var(--good)}.btn.bad{background:#fdecec;color:var(--bad)}
    .quiz-q{font-size:34px;font-weight:850;text-align:center;margin:14px 0 8px}.quiz-reading{font-size:18px;color:var(--muted);text-align:center;min-height:24px;margin-bottom:22px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:16px}.choice.correct{border-color:#7ac99b;background:#edf9f2}.choice.wrong{border-color:#e3a19b;background:#fff0ee}
    .section-title{font-size:18px;font-weight:800;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.small{font-size:12px;color:var(--muted)}
    .list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px}.item .main b{display:block}.item-reading{font-size:14px;color:var(--muted);margin:3px 0 4px}.item .main span{font-size:13px;color:var(--muted)}.iconbtn{border:0;background:#f2f2f4;border-radius:10px;padding:8px 10px}
    nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;z-index:10}nav .bar{max-width:620px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}nav button{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:700;color:#777}nav button.active{background:#111;color:#fff}
    .hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:30px 0}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">單字卡</div><div class="pill" id="todayLabel">今天</div></header>
  <div class="stats">
    <div class="stat"><b id="totalCount">0</b><span>全部單字</span></div>
    <div class="stat"><b id="masteredCount">0</b><span>已學會</span></div>
    <div class="stat"><b id="wrongCount">0</b><span>錯題</span></div>
  </div>

  <section id="learnPage">
    <div class="mode-tabs">
      <button class="active" data-deck="all">全部</button>
      <button data-deck="N4">N4</button>
      <button data-deck="N3">N3</button>
      <button data-deck="N2">N2</button>
      <button data-deck="N1">N1</button>
      <button data-deck="due">今日複習</button>
      <button data-deck="wrong">錯題</button>
      <button data-deck="mastered">已學會</button>
    </div>
    <div class="small" id="deckProgress" style="margin:4px 2px 10px"></div>
    <div class="panel">
      <div id="flashcard" class="flash">
        <div>
          <div class="word" id="fcWord">—</div>
          <div class="reading" id="fcReading"></div>
          <div class="meaning hidden" id="fcMeaning"></div>
          <div class="hint" id="fcHint">點一下翻卡</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn bad" id="againBtn">還不會</button>
        <button class="btn good" id="knowBtn">記住了</button>
      </div>
    </div>
  </section>

  <section id="quizPage" class="hidden">
    <div class="panel">
      <div class="section-title">四選一測驗</div>
      <div class="mode-tabs" id="quizTabs">
        <button class="active" data-quizdeck="all">全部</button>
        <button data-quizdeck="N4">N4</button>
        <button data-quizdeck="N3">N3</button>
        <button data-quizdeck="N2">N2</button>
        <button data-quizdeck="N1">N1</button>
      </div>
      <div class="small" id="quizProgress"></div>
      <div class="quiz-q" id="quizWord">—</div>
      <div class="quiz-reading" id="quizReading"></div>
      <div class="choices" id="choices"></div>
      <button class="btn primary" id="nextQuiz" style="margin-top:14px;width:100%">下一題</button>
    </div>
  </section>

  <section id="addPage" class="hidden">
    <div class="panel">
      <div class="section-title">新增單字</div>
      <div class="row">
        <input id="wordInput" placeholder="單字／漢字，例如：約束" />
        <input id="readingInput" placeholder="假名，例如：やくそく" />
        <input id="meaningInput" class="full" placeholder="中文意思，例如：約定" />
        <textarea id="exampleInput" class="full" placeholder="例句（可不填）"></textarea>
      </div>
      <button class="btn primary" id="addWordBtn" style="width:100%;margin-top:12px">加入單字庫</button>
    </div>
    <div class="panel">
      <div class="section-title">批次匯入</div>
      <div class="small">每行格式：單字｜假名｜中文｜例句</div>
      <textarea id="bulkInput" placeholder="約束｜やくそく｜約定｜約束を守ります。\n経験｜けいけん｜經驗｜いい経験になりました。"></textarea>
      <button class="btn" id="bulkBtn" style="width:100%;margin-top:10px">批次加入</button>
    </div>
  </section>

  <section id="libraryPage" class="hidden">
    <div class="panel">
      <div class="section-title">我的單字庫</div>
      <input id="searchInput" placeholder="搜尋單字、假名或中文" />
      <div class="list" id="wordList" style="margin-top:12px"></div>
    </div>
  </section>
</div>

<nav><div class="bar">
  <button class="active" data-page="learnPage">背單字</button>
  <button data-page="quizPage">測驗</button>
  <button data-page="addPage">新增</button>
  <button data-page="libraryPage">單字庫</button>
</div></nav>

    N3:{

      v:{jp:`時間があれば、もう一度${bare}ようと思います。`,zh:`如果有時間，我想再${m}一次。`},
      a:{jp:`思っていたより${bare}ので、少し驚きました。`,zh:`因為比想像中還要${m}，所以我有點驚訝。`}
    },
    N2:{
      n:{jp:`この問題を考えるうえで、「${bare}」は重要なポイントです。`,zh:`在思考這個問題時，「${bare}」是很重要的一點。`},
      v:{jp:`狀況をよく確認してから${bare}必要があります。`,zh:`有必要先仔細確認狀況後再${m}。`},
      a:{jp:`予想以上に${bare}ため、計畫を見直すことにしました。`,zh:`因為比預期還要${m}，所以決定重新檢討計畫。`}
    },
    N1:{
      n:{jp:`議論を深めるためには、「${bare}」という観點も無視できません。`,zh:`為了深入討論，也不能忽視「${bare}」這個觀點。`},
      v:{jp:`長期的な影響まで考慮したうえで${bare}ことが求められます。`,zh:`必須在連長期影響都納入考量後再${m}。`},
      a:{jp:`一見すると${bare}ように思えるが、背景には複雑な事情がある。`,zh:`乍看之下似乎${m}，但背後有著複雜的情況。`}
    }
  };
  const c=contexts[lv]||contexts.N3;
  let ex=isI?c.a:(isVerb?c.v:c.n);
  // 常見「する」動詞使用完整詞形，並同步提供真正對應的中文翻譯。
  if(isSuru){
    const stem=bare.replace(/する$/,'');
    ex=lv==='N4'?{jp:`今日は${stem}します。`,zh:`今天要${m}。`}:
       lv==='N3'?{jp:`必要なら、もう一度${stem}しようと思います。`,zh:`如果有需要，我想再${m}一次。`}:
       lv==='N2'?{jp:`十分に確認してから${stem}する必要があります。`,zh:`有必要充分確認後再${m}。`}:
       {jp:`狀況を慎重に見極めたうえで${stem}することが求められます。`,zh:`必須在慎重判斷狀況後再${m}。`};
  }
  return ex;
}
// v13：只要單字含有漢字，就在下一行顯示完整讀音；
// 原本就是片假名的部分保留片假名，只把漢字部分換成平假名。
// 例如：東京スカイツリー → とうきょうスカイツリー、テレビ局 → テレビきょく。
function hasKanji(s=''){
  return /[\u3400-\u4DBF\u4E00-\u9FFF々〆ヵヶ]/.test(String(s));
}
function toHiragana(s=''){
  return String(s).replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
}
function kanaForMatch(s=''){
  return toHiragana(String(s)).replace(/\s+/g,'');
}

function displayWord(x){
  if(!x)return '';
  // 同音但意思不同的項目，在這裡依中文義區分。
  if(x.w==='きかい') return /機器|機械/.test(x.m||'')?'機械':'機会';
  return commonKanjiMap[x.w] || x.w;
}
function displayReading(x){
  if(!x)return '';
  // 若主標題是由平假名補成漢字，原詞本身就是最完整、最可靠的讀音。
  if(displayWord(x)!==x.w) return x.w;
  if(x.fr) return x.fr;
  return fullHiraganaReading(x);
}

function fullHiraganaReading(x){
  if(!x||!hasKanji(x.w))return '';
  const surface=String(x.w||'').replace(/＝/g,'');
  let remaining=kanaForMatch(x.r||'');
  const chars=[...surface];
  const typeOf=c=>/[\u3400-\u4DBF\u4E00-\u9FFF々〆ヵヶ]/.test(c)?'K':(/[ぁ-ゖァ-ヶー～]/.test(c)?'A':'O');
  const tokens=[];
  for(const c of chars){
    const t=typeOf(c);
    if(tokens.length && tokens[tokens.length-1].type===t) tokens[tokens.length-1].text+=c;
    else tokens.push({type:t,text:c});
  }
  let out='';
  for(let i=0;i<tokens.length;i++){
    const tok=tokens[i];
    if(tok.type==='O'){
      out+=tok.text;
      continue;
    }
    if(tok.type==='A'){
      // 單字表面原本的平假名／片假名照原樣顯示。
      out+=tok.text;
      const anchor=kanaForMatch(tok.text);
      if(anchor && remaining.startsWith(anchor)) remaining=remaining.slice(anchor.length);
      continue;
    }
    // 漢字區段：用下一個假名區段當錨點，從讀音欄切出這段漢字的平假名。
    let nextAnchor='';
    for(let j=i+1;j<tokens.length;j++){
      if(tokens[j].type==='A'){
        nextAnchor=kanaForMatch(tokens[j].text);
        if(nextAnchor)break;
      }
    }
    if(nextAnchor){
      const pos=remaining.indexOf(nextAnchor);
      if(pos>=0){
        out+=remaining.slice(0,pos);
        remaining=remaining.slice(pos);
      }else{
        // 部分原始資料只記錄漢字讀音；此時直接使用目前剩餘讀音。
        out+=remaining;
        remaining='';
      }
    }else{
      out+=remaining;
      remaining='';
    }
  }
  return out;
}
function showCard(){
  const arr=getDeck();
  $('againBtn').textContent=deck==='mastered'?'重新學習':'還不會';
  $('knowBtn').classList.toggle('hidden',deck==='mastered');
  renderDeckProgress();
  if(!arr.length){
    $('fcWord').textContent='完成 🎉';
    $('fcReading').textContent=deck==='mastered'?'目前還沒有已學會的單字':'目前沒有需要學習的單字';
    $('fcMeaning').classList.add('hidden');$('fcHint').textContent='';return;
  }
  currentIndex=((currentIndex%arr.length)+arr.length)%arr.length;
  const x=arr[currentIndex]; revealed=false;
  $('fcWord').textContent=displayWord(x);
  const fullReading=displayReading(x);
  $('fcReading').textContent=fullReading?`${fullReading}${x.level?` · ${x.level}`:''}`:(x.level||'');
  $('fcMeaning').textContent=x.m;
  $('fcMeaning').classList.add('hidden');$('fcHint').textContent='點一下翻卡';
}
$('flashcard').onclick=()=>{revealed=!revealed; $('fcMeaning').classList.toggle('hidden',!revealed); $('fcHint').textContent=revealed?'再點一次可翻回正面':'點一下翻卡';}
function findReal(x){return words.find(y=>y.w===x.w&&y.r===x.r&&(y.source||'')===(x.source||''));}
function rate(known){
  const arr=getDeck(); if(!arr.length)return;
  const x=arr[currentIndex], real=findReal(x); if(!real)return;
  if(deck==='mastered'&&!known){
    real.mastered=false; real.score=0; real.wrong=0; real.next=0;
  }else if(known){
    real.mastered=true; real.score=(real.score||0)+1; real.wrong=0;
    const days=Math.min(30,Math.pow(2,Math.max(0,real.score-1)));
    real.next=Date.now()+days*86400000;
  }else{
    real.mastered=false; real.score=Math.max(0,(real.score||0)-1); real.wrong=(real.wrong||0)+1; real.next=Date.now()+10*60000;
  }
  save(); showCard();
}
$('againBtn').onclick=()=>rate(false); $('knowBtn').onclick=()=>rate(true);
document.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-deck]').forEach(x=>x.classList.remove('active'));b.classList.add('active');deck=b.dataset.deck;currentIndex=0;showCard();});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  ['learnPage','quizPage','addPage','libraryPage'].forEach(id=>$(id).classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');
  if(b.dataset.page==='quizPage'){
    if(['N4','N3','N2','N1'].includes(deck)) quizDeck=deck;
    syncQuizTabs();startQuiz();
  }
  if(b.dataset.page==='libraryPage')renderList();
});

$('addWordBtn').onclick=()=>{const w=$('wordInput').value.trim(),r=$('readingInput').value.trim(),m=$('meaningInput').value.trim(),e=$('exampleInput').value.trim();if(!w||!m)return alert('至少要填單字和中文意思');words.push({w,r,m,e,level:'自訂',source:'自訂',score:0,wrong:0,next:0,mastered:false});save();['wordInput','readingInput','meaningInput','exampleInput'].forEach(id=>$(id).value='');showCard();alert('已加入');}
$('bulkBtn').onclick=()=>{const lines=$('bulkInput').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);let n=0;lines.forEach(line=>{const [w,r,m,e='']=line.split(/[｜|]/).map(x=>x.trim());if(w&&m){words.push({w,r,m,e,level:'自訂',source:'自訂',score:0,wrong:0,next:0,mastered:false});n++;}});save();$('bulkInput').value='';showCard();alert(`已加入 ${n} 個單字`);}
function renderList(){
  const q=$('searchInput').value.trim().toLowerCase();const arr=words.filter(x=>(displayWord(x)+x.w+x.r+x.m).toLowerCase().includes(q));
  $('wordList').innerHTML=arr.length?arr.map(x=>{const rd=displayReading(x);return `<div class="item"><div class="main"><b>${esc(displayWord(x))}</b>${rd?`<div class="item-reading">${esc(rd)}</div>`:''}<span>${esc(x.m)}${x.source?` · ${esc(x.source)} p.${x.page||''}`:''} · ${isMastered(x)?'✅ 已學會':'學習中'}</span></div><div style="display:flex;gap:6px"><button class="iconbtn" data-toggle="${words.indexOf(x)}">${isMastered(x)?'重新學習':'標記學會'}</button><button class="iconbtn" data-del="${words.indexOf(x)}">刪除</button></div></div>`}).join(''):'<div class="empty">沒有找到單字</div>';
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const x=words[+b.dataset.toggle];x.mastered=!x.mastered;if(x.mastered){x.score=Math.max(1,x.score||0);x.wrong=0;x.next=Date.now()+86400000;}else{x.score=0;x.next=0;}save();renderList();showCard();});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{words.splice(+b.dataset.del,1);save();renderList();showCard();});
}
$('searchInput').oninput=renderList;
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function syncQuizTabs(){document.querySelectorAll('[data-quizdeck]').forEach(b=>b.classList.toggle('active',b.dataset.quizdeck===quizDeck));}
document.querySelectorAll('[data-quizdeck]').forEach(b=>b.onclick=()=>{quizDeck=b.dataset.quizdeck;syncQuizTabs();startQuiz();});
function getQuizTargets(){
  let arr=words.filter(x=>!isMastered(x));
  if(['N4','N3','N2','N1'].includes(quizDeck)) arr=arr.filter(x=>x.level===quizDeck);
  return arr;
}
function getQuizOptionPool(target){
  let arr=words.filter(x=>x!==target);
  if(['N4','N3','N2','N1'].includes(quizDeck)) arr=arr.filter(x=>x.level===quizDeck);
  return arr;
}
function startQuiz(){quizIndex=0;nextQuestion();}
function nextQuestion(){
  const targets=getQuizTargets();
  if(!targets.length){$('quizWord').textContent='完成 🎉';$('quizReading').textContent='';$('quizProgress').textContent=`${quizDeck==='all'?'全部':quizDeck}目前沒有尚未學會的單字`;$('choices').innerHTML='';return;}
  quizAnswered=false;
  const target=targets[Math.floor(Math.random()*targets.length)];
  const pool=getQuizOptionPool(target).sort(()=>Math.random()-.5).slice(0,3);
  if(pool.length<3){$('quizWord').textContent='單字數不足';$('quizReading').textContent='';$('quizProgress').textContent='此範圍至少需要 4 個單字才能進行四選一測驗';$('choices').innerHTML='';return;}
  const opts=[target,...pool].sort(()=>Math.random()-.5);
  $('quizWord').textContent=displayWord(target);
  $('quizReading').textContent=displayReading(target);
  $('quizProgress').textContent=`${quizDeck==='all'?'全部':quizDeck} · 第 ${quizIndex+1} 題 · 尚未學會 ${targets.length} 個`;
  $('choices').innerHTML=opts.map(x=>`<button class="choice" data-correct="${x===target}">${esc(x.m)}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(quizAnswered)return;quizAnswered=true;const correct=c.dataset.correct==='true';
    c.classList.add(correct?'correct':'wrong');document.querySelectorAll('.choice').forEach(k=>{if(k.dataset.correct==='true')k.classList.add('correct')});
    const real=findReal(target);
    if(correct){real.mastered=true;real.score=(real.score||0)+1;real.wrong=0;real.next=Date.now()+86400000;}
    else{real.mastered=false;real.wrong=(real.wrong||0)+1;real.score=Math.max(0,(real.score||0)-1);real.next=Date.now()+10*60000;}
    save();
  });
}
$('nextQuiz').onclick=()=>{quizIndex++;nextQuestion();}
$('todayLabel').textContent=new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date());
renderStats();renderDeckProgress();showCard();

  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
